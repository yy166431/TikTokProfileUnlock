name: Build TikTok Headers Capture

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Theos
      uses: actions/checkout@v3
      with:
        repository: theos/theos
        path: theos
        submodules: recursive

    - name: Setup Theos SDKs
      run: |
        curl -LO https://github.com/theos/sdks/archive/master.zip
        unzip master.zip
        mv sdks-master/iPhoneOS*.sdk theos/sdks/

    - name: Install ldid
      run: |
        brew install ldid

    - name: Build dylib
      run: |
        export THEOS=./theos
        make clean
        make
        find .theos -name "*.dylib" -type f

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: TikTokHeadersCapture
        path: .theos/obj/**/*.dylib

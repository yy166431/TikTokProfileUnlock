name: Build TikTokCapture

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Theos
      run: |
        sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
        sudo chown -R $(whoami):staff /opt/theos
        curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_x86_64
        chmod +x ldid_macosx_x86_64
        sudo mv ldid_macosx_x86_64 /usr/local/bin/ldid

    - name: Build dylib
      run: |
        export THEOS=/opt/theos
        make clean
        make FINALPACKAGE=1

    - name: Extract dylib
      run: |
        mkdir -p output
        cp .theos/obj/TikTokCapture.dylib output/
        cp TikTokCapture.plist output/
        cd output && zip -r TikTokCapture.zip TikTokCapture.dylib TikTokCapture.plist

    - name: Upload Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        files: |
          output/TikTokCapture.dylib
          output/TikTokCapture.plist
          output/TikTokCapture.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
